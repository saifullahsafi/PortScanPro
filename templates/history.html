<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scan History - PortScan Pro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>📋 Scan History</h1>

    <p class="subtitle">
        Previous PortScan Pro scans
    </p>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Target</th>
                <th>Start Port</th>
                <th>End Port</th>
                <th>Scan Time</th>
            </tr>
        </thead>

        <tbody>

            {% for scan in scans %}

            <tr>
                <td>
                    <a href="{{ url_for('scan_details', scan_id=scan.id) }}"
                    style="color: #38bdf8;">
                        {{ scan.id }}
                    </a>
                </td>
                <td>{{ scan.target }}</td>
                <td>{{ scan.start_port }}</td>
                <td>{{ scan.end_port }}</td>
                <td>{{ scan.scan_time }}</td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

    <br>

    <a href="/" style="color: #38bdf8;">
        ← Back to Scanner
    </a>

</div>

</body>
</html>
